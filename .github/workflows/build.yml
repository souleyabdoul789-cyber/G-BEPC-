name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache
      - run: pip install buildozer "cython<3"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: bz-${{ hashFiles('buildozer.spec') }}
      - name: Compilation
        run: yes | buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: gbepc-apk
          path: bin/*.apk
